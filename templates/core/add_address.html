<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Address - Foodly</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .navbar {
            background: #ff4d2d;
            padding: 18px 8%;
            color: white;
            font-size: 24px;
            font-weight: 800;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ff4d2d;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff4d2d;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn:hover {
            background: #e63e20;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #ff4d2d;
            text-decoration: none;
            font-weight: 700;
        }

    </style>

</head>

<body>

    <div class="navbar">
        🍴 Foodly
    </div>

    <div class="container">

        <div class="card">

            <h1>📍 Add New Address</h1>

            <div class="subtitle">
                Add your delivery address for faster checkout
            </div>

            <form
                method="POST"
                action="{% url 'add_address' %}"
            >

                {% csrf_token %}

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >

                <label>
                    Delivery Address
                </label>

                <input
                    type="text"
                    name="address_line"
                    placeholder="House / Street / Colony"
                    required
                >

                <label>
                    City
                </label>

                <input
                    type="text"
                    name="city"
                    placeholder="Enter city"
                    required
                >

                <label>
                    State
                </label>

                <input
                    type="text"
                    name="state"
                    placeholder="Enter state"
                    required
                >

                <label>
                    Pincode
                </label>

                <input
                    type="text"
                    name="pincode"
                    placeholder="Enter pincode"
                    required
                >

                <button
                    type="submit"
                    class="btn"
                >
                    ➕ Add Address
                </button>

            </form>

            <a
                href="{% url 'checkout' %}"
                class="back"
            >
                ← Back to Checkout
            </a>

        </div>

    </div>

</body>

</html>
