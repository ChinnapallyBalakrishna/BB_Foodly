<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Foodly</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fff4ef,
                #f7f8fa
            );

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .register-card {
            width: 92%;

            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 15px 45px rgba(0,0,0,0.10);
        }


        .logo {
            text-align: center;

            color: #ff4d2d;

            font-size: 30px;

            font-weight: 900;

            margin-bottom: 10px;
        }


        .title {
            text-align: center;

            font-size: 25px;

            font-weight: 900;

            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;
        }


        .message {
            background: #fff0f0;

            border: 1px solid #ffcaca;

            color: #d62828;

            padding: 12px 15px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;

            font-weight: 700;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 800;
        }


        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 11px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {
            border-color: #ff4d2d;

            box-shadow:
                0 0 0 3px rgba(255,77,45,0.10);
        }


        .register-btn {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 12px;

            background: #ff4d2d;

            color: white;

            font-size: 16px;

            font-weight: 900;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.25s;
        }


        .register-btn:hover {
            background: #e63d20;

            transform: translateY(-2px);
        }


        .login-text {
            text-align: center;

            margin-top: 22px;

            color: #777;

            font-size: 14px;
        }


        .login-text a {
            color: #ff4d2d;

            font-weight: 900;

            text-decoration: none;
        }


        .login-text a:hover {
            text-decoration: underline;
        }


        @media (max-width: 500px) {

            .register-card {
                padding: 25px 20px;
            }

            .logo {
                font-size: 27px;
            }

            .title {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>


    <div class="register-card">


        <div class="logo">

            🍔 Foodly

        </div>


        <div class="title">

            Create your account

        </div>


        <div class="subtitle">

            Join Foodly and start ordering delicious food.

        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="message">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <form
            method="POST"
            action="{% url 'register' %}"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn"
            >

                Create Account

            </button>


        </form>


        <div class="login-text">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>


    </div>


</body>

</html>
